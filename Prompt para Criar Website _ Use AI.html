ite o poder de múltiplos modelos de IA a partir de um só lugar\",\"feature_highlights_text_4\":\"Comunique em mais de 25 idiomas com tradução automática e deteção de idioma. Quebre as barreiras linguísticas nos teus projetos pessoais e profissionais.\",\"feature_highlights_text_1\":\"Compare respostas de diferentes modelos lado a lado para encontrar a melhor solução para as tuas necessidades específicas. Mude facilmente entre modelos sem alterar plataformas.\",\"feature_highlights_title_2\":\"Seleção de Modelo por Tarefa\",\"feature_highlights_description_2\":\"Escolha o melhor LLM para pesquisa, programação, escrita, geração de imagens ou qualquer outra tarefa\",\"feature_highlights_text_2\":\"Gere, edite e analise imagens com a mesma interface que usa para texto. Perfeito para projetos criativos e criação de conteúdo visual.\",\"feature_highlights_title_3\":\"Comandos Ativados por Voz\",\"feature_highlights_description_3\":\"Use a tua voz para interagir com qualquer modelo de IA\",\"feature_highlights_text_3\":\"Fale naturalmente com o teu assistente de IA e obtenha respostas em texto ou peça para que as leiam para si. Excelente para multitarefas e acessibilidade.\",\"feature_highlights_title_4\":\"Mais de 5 Idiomas Suportados\",\"feature_highlights_description_4\":\"Fale o teu idioma — literalmente\"},\"ModelLogos\":{\"model_gpt_4_description\":\"O GPT-4 é o modelo de linguagem mais recente e avançado da OpenAI\",\"model_anthropic_description\":\"O Claude é um modelo de linguagem poderoso da Anthropic\",\"model_ollama_description\":\"O Llama é um modelo de linguagem poderoso da Ollama\",\"model_deepseek_description\":\"O DeepSeek é um modelo de linguagem poderoso da DeepSeek\",\"model_grok_description\":\"O Grok 3 é um modelo de linguagem poderoso da Grok\",\"model_gemini_description\":\"O mais recente modelo de raciocínio\",\"model_meta_description\":\"O mais recente modelo da Meta\"},\"Pricing\":{\"pricing_title\":\"Preços\",\"pricing_subtitle\":\"Escolha o pla _k2\":\"DeepInfra Kimi K2 é um modelo especializado otimizado para lidar com perguntas desafiadoras e complexas que exigem raciocínio profundo e análise abrangente.\",\"model_card_description_gpt_4o_mini\":\"GPT-4o Mini é uma versão simplificada do GPT-4o que oferece respostas rápidas e eficientes, mantendo alta qualidade para tarefas e conversas do dia a dia.\",\"model_card_description_gpt_5\":\"GPT-5 é o modelo de linguagem principal da OpenAI, que se destaca em raciocínio complexo, amplo conhecimento do mundo real, tarefas intensivas em código e processos multi-etapas.\",\"model_card_description_grok_4\":\"O mais novo e poderoso modelo principal da xAI, oferecendo desempenho incomparável em linguagem natural, matemática e raciocínio – o coringa perfeito.\",\"model_card_description_gpt_4o\":\"O GPT-4o combina confiabilidade com fortes capacidades de raciocínio, fornecendo desempenho consistente em uma ampla gama de tarefas com processamento eficiente.\",\"model_card_selected\":\"Selecionado\",\"model_claude_opus_4_1_subtitle\":\"Respostas ponderadas e cuidadas\",\"model_claude_opus_4_5_subtitle\":\"Opus sólido e equilibrado\",\"model_deepseek_r1_subtitle\":\"Explica teus passos claramente\",\"model_gemini_2_5_flash_subtitle\":\"Excelente em tudo\",\"model_card_description_gemini_3_pro\":\"O Gemini 3 Pro é a última geração de modelos, oferecendo desempenho incomparável em linguagem natural, matemática e raciocínio.\",\"model_gemini_3_pro_subtitle\":\"Raciocínio, grande contexto\",\"model_qwen_3_max_subtitle\":\"Lida com trabalhos longos e detalhados\",\"model_llama_3_3_70b_versatile_subtitle\":\"Versátil para tarefas do dia a dia\",\"model_deepinfra_kimi_k2_subtitle\":\"Excelente para perguntas difíceis\",\"model_gpt_4o_mini_subtitle\":\"Rápido e responsivo\",\"model_gpt_5_subtitle\":\"Modelo de chat inteligente\",\"model_gpt_4o_subtitle\":\"Confiável, raciocínio forte\",\"model_grok_4_subtitle\":\"Rápido, perspicaz e útil\",\"model_gpt_5_4_subtitle\":\"Modelo prin ão\",\"style_prompt_realistic\":\"Transforma a minha foto carregada numa imagem hiper-realista de alta definição. Melhora a iluminação, texturas e detalhes para que pareça uma fotografia tirada profissionalmente com clareza perfeita, cores naturais e profundidade de campo cinematográfica.\",\"style_prompt_cartoon\":\"Transforma a minha foto carregada numa ilustração vibrante de desenho animado. Reimagina o sujeito com contornos marcados, características exageradas, cores brilhantes e saturadas, e um estilo animado divertido semelhante aos filmes de animação modernos.\",\"style_prompt_3d\":\"Transforma a minha foto carregada num rendering 3D de alta qualidade. Reimagina o sujeito como um modelo 3D detalhado com superfícies suaves, iluminação de estúdio, sombras subtis e uma aparência tridimensional polida como um personagem da Pixar ou CGI.\",\"style_prompt_anime\":\"Transforma a minha foto carregada em estilo anime. Reimagina o sujeito com grandes olhos expressivos, cabelo estilizado, linhas limpas e a estética distintiva do anime japonês com iluminação dramática e cores vívidas.\",\"style_prompt_digital_art\":\"Transforma a minha foto carregada numa impressionante obra de arte digital. Reimagina o sujeito com técnicas criativas de pintura digital, paletas de cores ricas, pinceladas artísticas e uma estética de ilustração digital moderna.\",\"style_prompt_abstract\":\"Transforma a minha foto carregada numa obra de arte abstrata. Reimagina o sujeito usando formas geométricas, blocos de cores ousados, composições surrealistas e abstração artística mantendo a essência do original reconhecível.\",\"discover_prompt_text_cartoon\":\"Pega na minha foto carregada e transforma-me num divertido personagem de desenho animado. Reimagina a minha aparência como se eu fosse um personagem num filme de animação da Pixar ou Disney — usa contornos marcados, características exageradas mas lisonjeiras, cores vibrantes e um estilo animado expressivo. Mantém a minha semelhança reconhecível.\",\"discover_prompt_text_headshot\":\"Pega na minha foto carregada e cria um retrato profissional de negócios. Melhora a iluminação, aprimora os detalhes, usa um fundo limpo neutro ou degradê, garante vestuário e postura profissionais, e faz-me parecer polido e confiante — como se fosse tirada por um fotógrafo de retratos profissional.\",\"discover_prompt_text_pet_royalty\":\"Pega na minha foto carregada e reimagina o meu animal de estimação como realeza. Veste-o com trajes reais como coroa, capa real e joias. Coloca-o num trono ornamentado ou num cenário de grande palácio. Faz parecer um retrato real oficial com iluminação dramática e detalhes ricos e opulentos.\",\"discover_prompt_text_superhero\":\"Pega na minha foto carregada e transforma-me num super-herói. Dá-me um fato de super-herói único e original com capa, máscara ou emblema, e um físico de super-herói. Coloca-me numa pose de ação dramática com uma paisagem urbana ou fundo épico. Adiciona efeitos visuais como auras de energia, vento ou iluminação dramática.\",\"discover_prompt_text_watercolor\":\"Pega na minha foto carregada e transforma-a numa bela pintura de aguarela. Usa pinceladas de aguarela suaves e fluidas, difusões de cor delicadas, lavagens translúcidas e a textura de papel característica da arte de aguarela tradicional. Mantém a composição reconhecível mas com uma qualidade artística pintada à mão.\",\"discover_prompt_text_action_figure\":\"Pega na minha foto carregada e reimagina-me como uma figura de ação colecionável na sua embalagem. Mostra-me como uma figura de ação detalhada com textura plástica, articulações móveis e acessórios. Inclui embalagem de brinquedo realista com janela transparente, cartão de fundo colorido e marca do produto.\",\"enhancer_headline\":\"Envie uma foto para melhorar e ampliar com IA\",\"enhancer_prompt_prefix\":\"Melhorar e ampliar a minha imagem.\",\"send_button_generate\":\"Gerar\",\"news_ticker_badge_new\":\"NOVO\",\"news_ticker_b_1\":\"Nano Banana Pro está d ra resolução mais alta com IA\"},\"ChatExamples\":{\"email\":{\"title\":\"Ajude-me a escrever (exemplo)\",\"user_1\":\"Preciso escrever um e-mail para meu gerente solicitando folga no próximo mês. Quero que pareça profissional, mas não muito formal. Aqui está o que quero dizer: preciso de 5 dias de folga de 10 a 14 de março para um evento familiar.\",\"assistant_1\":\"Aqui está uma versão refinada do seu pedido de folga:\\n\\nAssunto: Solicitação de folga - 10 a 14 de março\\n\\nOlá [nome do gerente],\\n\\nEspero que você esteja bem. Gostaria de solicitar folga de segunda-feira, 10 de março, a sexta-feira, 14 de março, para um evento familiar.\\n\\nGarantirei que todas as tarefas e prazos atuais sejam cumpridos antes de partir e ficarei feliz em coordenar a transferência com a equipe.\\n\\nPor favor, deixe-me saber se você precisar de detalhes adicionais.\\n\\nAtenciosamente,\\n[Seu nome]\\n\\n---\\n\\nQuer que eu ajuste o tom, adicione mais contexto ou diminua o tempo?\",\"user_2\":\"Você pode torná-lo mais curto? Apenas 2-3 frases.\",\"assistant_2\":\"Assunto: Solicitação de folga - 10 a 14 de março\\n\\nOlá [nome do gerente],\\n\\nGostaria de solicitar uma folga de 10 a 14 de março para um evento familiar. Todo o trabalho atual será coberto antes de eu partir. Deixe-me saber se você precisar de mais alguma coisa.\\n\\nMelhor,\\n[Seu nome]\\n\\n---\\n\\nFeito. Quer que eu ajuste mais alguma coisa?\"},\"logo\":{\"title\":\"Criar um logo (exemplo)\",\"user_1\":\"Estou abrindo uma pequena cafeteria chamada \\\"Morning Ritual\\\" e preciso de um logotipo. Quero algo clean e moderno, talvez com um ícone de xícara de café.\",\"prompt_1\":\"Logotipo moderno e limpo para uma cafeteria chamada Morning Ritual, silhueta mínima de xícara de café com vapor formando um tema sutil do nascer do sol, tipografia contemporânea sem serifa, preto e branco\",\"assistant_1\":\"Aqui está um conceito de logotipo limpo e moderno para Morning Ritual. Apresenta uma silhueta mínima de xícara de café com vapor formando um motivo sutil de nascer do sol. A tipografia usa uma fonte sem serifa contemporânea.\\n\\nQuer que eu experimente um estilo diferente, mude as cores ou ajuste o ícone?\",\"user_2\":\"Eu gosto, mas você pode experimentar com tons terrosos? Marrom e creme em vez de preto.\",\"prompt_2\":\"Logotipo moderno e limpo para uma cafeteria chamada Morning Ritual, silhueta mínima de xícara de café com vapor formando um motivo sutil de nascer do sol, tipografia contemporânea sem serifa, tons de terra, ícone marrom profundo, fundo creme rico\",\"assistant_2\":\"Aqui está a versão atualizada com tons quentes de terra - marrom profundo para o ícone e creme rico para o fundo. A paleta quente confere um toque mais convidativo e artesanal.\\n\\nQuer que eu crie variações, adicione um slogan ou prepare arquivos para tamanhos diferentes?\"},\"resume\":{\"title\":\"Revise meu currículo (exemplo)\",\"user_1\":\"Estou me candidatando a um cargo de gerente de marketing. Você pode revisar meu currículo e me dizer o que devo melhorar?\",\"assistant_1\":\"Eu revisei seu currículo. Aqui estão as principais áreas a serem melhoradas:\\n\\n- Seu resumo é muito genérico. Deve mencionar sua experiência específica em marketing e os resultados mensuráveis ​​​​que você alcançou.\\n\\n- A seção de experiência profissional lista responsabilidades, mas não resultados. Por exemplo, em vez de “Contas de mídia social gerenciadas”, tente “Aumentou o envolvimento na mídia social em 45% em 6 meses”.\\n\\n- A seção de habilidades não contém palavras-chave nas descrições de cargos típicos de gerente de marketing, como análise de campanha, gerenciamento de orçamento e testes A/B.\\n\\n- A formatação está limpa, mas sua função mais recente deve ter mais detalhes do que as posições mais antigas.\\n\\nQuer que eu reescreva seu resumo ou sugira marcadores mais fortes para uma função específica?\",\"user_2\":\"Você pode reescrever o resumo para mim?\",\"assistant_2\":\"Aqui está um resumo
